<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" role="img" aria-label="Manual de marca Anti-Murphy, uma página"><rect width="800" height="1100" fill="#F7F7F3"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1D292D}.h{font-size:28px;font-weight:700}.body{font-size:19px}.small{font-size:16px}</style><text class="h" x="60" y="76">ANTI-MURPHY / IDENTIDADE VISUAL</text><text class="small" x="60" y="110">Versão oficial · 25 setembro 2026</text><image href="logo-light.svg" x="60" y="168" width="680" height="109"/><text class="h" x="60" y="365">O símbolo</text><text class="body" x="60" y="404">Esquerda: operação estável.</text><text class="body" x="60" y="434">Centro: evento Murphy identificado na simulação.</text><text class="body" x="60" y="464">Direita: estabilização após a decisão.</text><text class="h" x="60" y="540">Paleta</text><rect x="60" y="565" width="90" height="60" fill="#1D292D"/><text class="small" x="165" y="592">Grafite  #1D292D  /  RGB 29, 41, 45</text><rect x="60" y="640" width="90" height="60" fill="#FF681B"/><text class="small" x="165" y="668">Laranja  #FF681B  /  RGB 255, 104, 27</text><rect x="60" y="715" width="90" height="60" fill="#F7F7F3" stroke="#1D292D"/><text class="small" x="165" y="743">Neutro  #F7F7F3  /  RGB 247, 247, 243</text><text class="h" x="60" y="836">Aplicação</text><text class="body" x="60" y="875">Logo: lettering vetorial geometrico proprio, sem fonte externa.</text><text class="body" x="60" y="905">Proteção: mínimo 12/32 da largura do símbolo em cada lado.</text><text class="body" x="60" y="935">Use a versão clara, escura ou monocromática conforme o fundo.</text><text class="small" x="60" y="981">Não distorcer, recolorir, girar ou fechar a quebra da barra laranja.</text><text class="small" x="60" y="1012">Logo em contornos vetoriais: independe de fonte instalada.</text></svg>
